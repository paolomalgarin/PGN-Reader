<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGN Reader</title>
    <link rel="shortcut icon" href="https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg"
        type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="index.css">
    <script>
        // Applicato PRIMA che il CSS venga dipinto, per evitare un lampo del
        // tema sbagliato: legge la preferenza salvata, altrimenti quella di
        // sistema. Il pulsante nell'header (gestito da reader/main.js) la
        // aggiorna e la ricorda per le visite successive.
        (function () {
            try {
                var saved = localStorage.getItem('pgn-reader-theme');
                var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) { /* localStorage non disponibile: resta il tema chiaro di default */ }
        })();
    </script>
</head>

<body>
    <!-- Header: sostituisce i vecchi controlli "flottanti" sopra la
         scacchiera (mute, streak, banner di esplorazione) che su mobile
         finivano a coprirne le prime righe, impedendo di muovere i pezzi lì.
         Essendo qui nel normale flusso della pagina, la scacchiera parte
         sempre SOTTO di lui: risolve il bug alla radice. Resta visibile in
         ogni modalità (anche in DRILL, dove il pannello dei tab è nascosto),
         quindi ospita anche il selettore di modalità. -->
    <header class="app-header">
        <div class="app-header-slot app-header-start">
            <button id="btn-theme" class="icon-btn" title="Cambia tema chiaro/scuro" aria-label="Cambia tema"></button>
            <button id="btn-mute" class="icon-btn" title="Attiva/disattiva suoni" aria-label="Attiva/disattiva suoni">🔊</button>
        </div>

        <div class="app-header-slot app-header-center">
            <div id="drill-streak" class="drill-streak">
                <span class="drill-streak-flame">♛</span>
                <span id="drill-streak-count">0</span>
            </div>

            <!-- Mostrato solo in READ mentre ci sono mosse "di prova" non
                 salvate sulla scacchiera. -->
            <div id="exploration-banner" class="exploration-banner">
                <span class="exploration-banner-text">🔀 Exploring — not saved to PGN</span>
                <button id="btn-reset-exploration" class="exploration-reset-btn" title="Discard exploration">↺ Reset</button>
            </div>
        </div>

        <div class="app-header-slot app-header-end">
            <div class="mode-switch" id="mode-switch">
                <button type="button" class="mode-switch-btn" id="mode-btn-edit" data-mode="EDIT">EDIT</button>
                <button type="button" class="mode-switch-btn" id="mode-btn-read" data-mode="READ">READ</button>
                <button type="button" class="mode-switch-btn" id="mode-btn-drill" data-mode="DRILL">DRILL</button>
            </div>
        </div>
    </header>

    <div class="board-and-controls">

        <div class="game-area">
            <!-- EVAL BAR -->
            <div class="eval-bar-wrapper" id="eval-bar">
                <div class="eval-bar-text top" id="eval-text-top"></div>
                <div class="eval-bar-fill" id="eval-fill"></div>
                <div class="eval-bar-text bottom" id="eval-text-bottom">0.0</div>
            </div>

            <!-- BOARD -->
            <div id="board-container"></div>
        </div>

        <div class="tabs">
            <div class="tab-switcher">
                <div class="tab selected" id="analysis-tab">ANALYSIS</div>
                <div class="tab" id="edit-tab">NOTES</div>
                <div class="tab" id="export-tab">FILE</div>
            </div>

            <!-- TAB: ANALYSIS -->
            <div id="analysis" class="tab-content">
                <!-- Comment goes first: on small screens it's what you want to
                     read without having to scroll past everything else. -->
                <div id="move-comment" class="move-comment"></div>

                <div class="buttons">
                    <button id="btn-analysis">Start Analysis</button>
                    <button id="btn-flip">Flip board</button>
                </div>

                <!-- Chess.com-style navigation arrows — handy on mobile,
                     where there's no keyboard to use arrow keys with. -->
                <div class="nav-buttons">
                    <button id="btn-nav-first" class="nav-btn nav-btn-ghost" title="Start">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6l-7 6 7 6"/><path d="M9 6l-7 6 7 6"/></svg>
                    </button>
                    <button id="btn-nav-back" class="nav-btn nav-btn-primary" title="Back">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
                    </button>
                    <button id="btn-nav-forward" class="nav-btn nav-btn-primary" title="Forward">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                    </button>
                    <button id="btn-nav-last" class="nav-btn nav-btn-ghost" title="End of this line">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l7 6-7 6"/><path d="M15 6l7 6-7 6"/></svg>
                    </button>
                </div>

                <div id="engine-info">Engine off</div>

                <div class="move-list-header">
                    <label class="field-label">Moves</label>
                    <button id="btn-toggle-move-arrows" class="toggle-arrows-btn" title="Show/hide the available-move arrows">➜ move arrows</button>
                </div>
                <div id="move-list" class="move-list"></div>
            </div>

            <!-- TAB: NOTES (comment + NAG editing) -->
            <div id="edit" class="tab-content" style="display: none;">
                <label class="field-label" for="comment-editor">Move comment</label>
                <textarea id="comment-editor" class="comment-editor" spellcheck="false"></textarea>
                <button id="btn-comment-template" class="secondary">Insert tag template</button>

                <label class="field-label">NAG</label>
                <div id="nag-palette" class="nag-palette"></div>

                <div class="edit-danger-zone">
                    <button id="btn-set-mainline" class="secondary">⭐ Set as mainline</button>
                    <button id="btn-delete-subtree" class="danger delete-subtree-btn">
                        Delete this move and its variations
                    </button>
                </div>
            </div>

            <!-- TAB: FILE (import/export PGN) -->
            <div id="export" class="tab-content" style="display: none;">
                <label class="field-label" for="pgn-file-input">Load PGN from file (replaces the current game)</label>
                <input type="file" id="pgn-file-input" accept=".pgn,.txt,text/plain,*/*" />
                <p id="pgn-import-error" class="error-text" hidden></p>

                <div class="pgn-preview-header">
                    <label class="field-label" for="pgn-export-preview">Current PGN</label>
                    <label class="pgn-clean-toggle-label">
                        <input type="checkbox" id="pgn-preview-clean-toggle" />
                        Clean preview
                    </label>
                </div>
                <textarea id="pgn-export-preview" class="pgn-export-preview" readonly spellcheck="false"></textarea>

                <div class="export-buttons">
                    <button id="btn-download-pgn">Download .pgn</button>
                    <button id="btn-download-pgn-clean" class="secondary" title="No arrows, highlights or opening names — just your own notes">Download clean .pgn</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Barra del DRILL: sostituisce il vecchio pulsante "flip" fisso in
         basso a sinistra — anche questo ora prende spazio vero nel layout
         invece di galleggiare sopra la scacchiera. Visibile solo in DRILL
         (dove il resto dei tab è nascosto). -->
    <div class="drill-toolbar">
        <button id="btn-flip-drill" class="drill-flip-btn">↺ Flip board</button>
    </div>

    <!-- Canvas per i coriandoli d'oro ai milestone di streak in DRILL -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Chessboard.js stays a classic script (data-URI SVGs generated on the
         fly, no module needed). reader/main.js is an ES module and imports
         the rest of the app. -->
    <script src="Chessboard.js"></script>
    <script src="reader/main.js" type="module"></script>
</body>

</html>
